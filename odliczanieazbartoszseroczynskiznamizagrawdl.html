<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odliczanie az serek zagra w dl2</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

   body{
  background:#000;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  gap:40px;
}

    .timer-container{
      display:flex;
      gap:40px;
      text-align:center;
      flex-wrap:wrap;
      justify-content:center;
    }

    .box{
      background:#111;
      padding:40px;
      border-radius:25px;
      min-width:220px;
      box-shadow:0 0 30px rgba(255,255,255,0.1);
    }

    .number{
      font-size:7vw;
      font-weight:bold;
    }

    .label{
      margin-top:15px;
      font-size:1.8vw;
      color:#aaa;
      letter-spacing:2px;
    }

    @media(max-width:900px){

      .timer-container{
        flex-direction:column;
      }

      .number{
        font-size:18vw;
      }

      .label{
        font-size:5vw;
      }
    .title{
  font-size:3vw;
  letter-spacing:4px;
  color:white;
  text-align:center;
}
    }
  </style>
</head>
<body>
   <h1 class="title">ODLICZANIE AZ SEREK ZAGRA Z NAMI W DL2</h1>

  <div class="timer-container">

    <div class="box">
      <div class="number" id="days">00</div>
      <div class="label">DNI</div>
    </div>

    <div class="box">
      <div class="number" id="hours">00</div>
      <div class="label">GODZINY</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">00</div>
      <div class="label">MINUTY</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">00</div>
      <div class="label">SEKUNDY</div>
    </div>

  </div>

  <script>
    // DATA STARTU
    const startDate = new Date("2026-04-17T00:00:00");

    function updateTimer() {

      const now = new Date();

      // różnica w sekundach
      const diff = Math.floor((now - startDate) / 1000);

      const days = Math.floor(diff / 86400);
      const hours = Math.floor((diff % 86400) / 3600);
      const minutes = Math.floor((diff % 3600) / 60);
      const seconds = diff % 60;

      document.getElementById("days").innerText =
        String(days).padStart(2, '0');

      document.getElementById("hours").innerText =
        String(hours).padStart(2, '0');

      document.getElementById("minutes").innerText =
        String(minutes).padStart(2, '0');

      document.getElementById("seconds").innerText =
        String(seconds).padStart(2, '0');
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
